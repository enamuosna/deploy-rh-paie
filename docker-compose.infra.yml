# Infrastructure de developpement de l'ERP RTS.
#   docker compose -f deploy/docker-compose.infra.yml --env-file deploy/.env up -d
name: rts-erp

services:
  postgres:
    image: postgres:16-alpine
    container_name: rts-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: postgres
      TZ: Africa/Dakar
      LANG: fr_FR.utf8
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rts-erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-erp}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_CONSOLE_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  seq:
    image: datalust/seq:2024.3
    container_name: rts-erp-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: rts-erp-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:8080"
      - "${CADDY_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  rabbitmq-data:
  seq-data:
  caddy-data:
  caddy-config:
